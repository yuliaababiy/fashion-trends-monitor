name: Keep Streamlit alive

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours at HH:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dashboard
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 60 \
              -A "Mozilla/5.0 (compatible; KeepAliveBot/1.0)" \
              https://fashion-trends-monitor.streamlit.app/)
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "Dashboard did not respond with 200, but ping was sent."
