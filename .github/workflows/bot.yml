name: Telegram bot poller

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch: {}

permissions:
  contents: write           # so the offset/mute state can be persisted

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests python-dotenv

      - name: Poll Telegram
        run: python -m src.alerts.telegram --poll-once

      - name: Commit bot state
        run: |
          git config user.name  "trend-monitor-bot"
          git config user.email "trend-monitor-bot@users.noreply.github.com"
          git add reports/state/telegram_offset.json reports/state/telegram_muted.json || true
          if git diff --staged --quiet; then
            echo "No state changes."
          else
            git commit -m "chore(bot): update telegram state [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
