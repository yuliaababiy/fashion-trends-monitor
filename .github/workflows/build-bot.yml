name: Build & push bot image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements-bot.txt"
      - "src/alerts/telegram.py"
      - "src/config.py"
      - ".github/workflows/build-bot.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ secrets.ACR_NAME }}.azurecr.io \
            -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fashion-trends-bot:v1 \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/fashion-trends-bot:${{ github.sha }} \
            -f Dockerfile .

      - name: Push image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fashion-trends-bot:v1
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/fashion-trends-bot:${{ github.sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new revision to Container App
        run: |
          az containerapp revision copy \
            -n fashion-trends-bot \
            -g ftm-rg \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/fashion-trends-bot:${{ github.sha }}
