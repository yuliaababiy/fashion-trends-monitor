name: Daily monitor

on:
  schedule:
    - cron: "0 7 * * *"     # 07:00 UTC every day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS }}
      REDDIT_PROXIES: ${{ secrets.REDDIT_PROXIES }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_sm

      - name: Run daily monitor
        run: python -m src.monitor.daily

      - name: Notify Telegram
        if: success()
        run: python -m src.alerts.telegram --send "✅ *Щоденний моніторинг завершено* — дані та прогнози оновлено."
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name  "trend-monitor-bot"
          git config user.email "trend-monitor-bot@users.noreply.github.com"
          git add data/raw/*.parquet data/processed/*.parquet \
                  data/interim/*.parquet \
                  reports/metrics/*.csv reports/state/*.csv \
                  reports/state/*.json || true
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(daily): update data + metrics [skip ci]"
            git push
          fi
